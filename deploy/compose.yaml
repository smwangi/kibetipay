# KibetiPay, self-hosted with Docker Compose and reachable from this machine only.
# See deploy/README.md. Run from the repository root:
#
#   docker compose -f deploy/compose.yaml up -d --build
#   docker compose -f deploy/compose.yaml -f deploy/compose.observability.yaml up -d --build   # + telemetry
#
# Every service has a memory limit, so each sizes itself to its own budget (base stack: ~1.5 GB max).
# Nothing listens on the network: the web app is published on 127.0.0.1 only; the API, its
# actuator port and Postgres are reachable only on the internal compose network.
name: kibetipay-deploy

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: kibetipay
      POSTGRES_USER: kibetipay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kibetipay -d kibetipay"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *hardened
    build:
      context: ..
      dockerfile: Dockerfile
    image: kibetipay-api:local
    # The JVM sizes its heap from this limit (-XX:MaxRAMPercentage=75 in the image). Without a
    # limit it sizes from the whole machine, grows into memory other services need, and the
    # kernel OOM-kills it (seen on a 2 GB VM).
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - users.env                     # APP_SECURITY_USERS_<n>_* (bcrypt hashes); see users.env.example
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kibetipay
      DB_USERNAME: kibetipay
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      KIBETIPAY_CURRENCY: ${KIBETIPAY_CURRENCY:-KES}
      # The LLM features are off unless a model is configured.
      APP_AI_ENABLED: ${APP_AI_ENABLED:-false}
      APP_INSIGHTS_ENABLED: ${APP_INSIGHTS_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-not-configured}
    tmpfs:
      - /tmp                          # Tomcat work directory; the rest of the filesystem is read-only
    healthcheck:
      # The image has no curl; bash can speak HTTP to the internal actuator port.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      # Startup takes ~40s on a normal host and was measured at ~150s on a 2 GB Colima VM. The grace
      # period only delays counting failures; the service turns healthy as soon as a check passes.
      start_period: 300s
      retries: 6

  web:
    <<: *hardened
    build:
      context: ../web
    image: kibetipay-web:local
    mem_limit: 256m
    depends_on:
      api:
        condition: service_healthy
    environment:
      KIBETIPAY_API_URL: http://api:8080
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in deploy/.env (openssl rand -hex 32)}
    ports:
      - "127.0.0.1:${WEB_PORT:-3080}:3000"
    tmpfs:
      - /app/.next/cache
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

volumes:
  pgdata:
