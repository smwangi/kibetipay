# Weekly dependency updates. Minor and patch bumps are grouped per ecosystem to keep the PR
# count down; majors arrive one per PR so they can be reviewed on their own. Every update
# PR runs the same CI, including the financial integrity tests, before it can merge.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
