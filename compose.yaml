# Picked up automatically by spring-boot-docker-compose in the dev profile.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: kibetipay
      POSTGRES_USER: kibetipay
      POSTGRES_PASSWORD: kibetipay-dev
    ports:
      - "5433:5432"   # host 5433: avoids clashing with a locally installed Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  # Search read model (search module). Security plugin off: local dev only.
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 12

  # Kibana-equivalent UI: Dev Tools console, Discover, dashboards. http://localhost:5601
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      - opensearch
    labels:
      org.springframework.boot.ignore: "true"

  # Observability backend for local dev, all in one container: OpenTelemetry Collector (OTLP
  # :4317 gRPC / :4318 HTTP) feeding Tempo (traces), Loki (logs) and Prometheus (metrics), with
  # Grafana on http://localhost:3001 (admin/admin). Spring Boot recognises the image and points
  # the OTLP trace, metric and log exporters at it automatically. Needs roughly 1 GB of memory.
  otel-lgtm:
    image: grafana/otel-lgtm:0.40.0
    ports:
      - "3001:3000"   # Grafana; host 3000 belongs to the Next.js dev server
      - "4317:4317"
      - "4318:4318"
    volumes:
      - lgtm:/data
      # KibetiPay dashboard ("KibetiPay" folder) and alert rules, versioned in observability/grafana
      - ./observability/grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/kibetipay.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/kibetipay-dashboards:ro
      - ./observability/grafana/provisioning/alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/kibetipay.yaml:ro

volumes:
  lgtm:
  pgdata:
  ollama:
  osdata:
