# Defaults shared by every environment. Profiles override values, never keys.
spring:
  application:
    name: kibetipay
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true            # Java 21 virtual threads for request + async work
  task:
    execution:
      # Carry the trace (and MDC) across @Async hand-offs, so the transfer saga that runs after
      # commit appears in the same trace as the POST that started it.
      propagate-context: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/kibetipay}
    username: ${DB_USERNAME:kibetipay}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false        # no lazy loading leaking into controllers
    hibernate:
      ddl-auto: validate       # Flyway owns the schema
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true        # event_publication table = transactional outbox
      republish-outstanding-events-on-restart: true
      completion-mode: update
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${AI_CHAT_MODEL:llama3.2}
          temperature: 0.1
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:nomic-embed-text}
      init:
        pull-model-strategy: when_missing
    vectorstore:
      # Opt-in: the pgvector store needs an EmbeddingModel, and no embedding provider is on the
      # classpath yet. With "none" the assistant answers without policy retrieval (RAG).
      # Add an embedding starter, then set AI_VECTOR_STORE=pgvector.
      type: ${AI_VECTOR_STORE:none}
      pgvector:
        initialize-schema: true
        dimensions: 768        # nomic-embed-text
        index-type: hnsw
        distance-type: cosine_distance

server:
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness + readiness for k8s
  observations:
    annotations:
      enabled: true            # activates @Observed (timers + traces)
    key-values:
      application: kibetipay
  tracing:
    sampling:
      probability: 0.1
  # Telemetry export is off the payment path: spans, log records and metrics are batched and
  # exported asynchronously from bounded queues, so a down Collector loses telemetry, never money.
  # Trace and log export start only once an endpoint is known (compose service connection in dev,
  # MANAGEMENT_OPENTELEMETRY_{TRACING,LOGGING}_EXPORT_OTLP_ENDPOINT elsewhere). OTLP metrics
  # default to localhost, so they stay off unless a profile opts in; Prometheus scraping always works.
  otlp:
    metrics:
      export:
        enabled: false
        # OTLP defaults to milliseconds; seconds keeps names identical to the Prometheus scrape
        # (e.g. ledger_post_seconds_bucket), so one dashboard works for both export paths.
        base-time-unit: seconds
  metrics:
    distribution:
      percentiles-histogram:
        kibetipay.transfer.settlement: true
        transfer.process: true
        ledger.post: true
        risk.assess: true
        lending.repay: true
        kibetipay.external.request.duration: true

# JDBC spans (datasource-micrometer): connection acquisition shows pool waits, query spans show
# slow SQL and lock waits. Row fetches are left out as noise. Bind parameter values are never
# recorded: they carry amounts and user ids.
jdbc:
  includes: connection, query
  datasource-proxy:
    include-parameter-values: false

app:
  reconciliation:
    # Independent ledger checks (journals balance, balances match entries, trial balance is zero).
    # Read-only; results are exported as kibetipay.reconciliation.* gauges.
    interval: ${KIBETIPAY_RECONCILIATION_INTERVAL:PT5M}
  currencies:
    # Registry only: the ledger remains limited to the configured operating currency for now.
    enabled: ${KIBETIPAY_ENABLED_CURRENCIES:${app.ledger.default-currency}}
  ai:
    enabled: true                     # false = no LLM beans are created; @Fallback no-op beans take over
  ledger:
    default-currency: ${KIBETIPAY_CURRENCY:KES}
    float-owner-id: "system:float"
  transfer:
    max-amount-minor: 10000000        # 100,000.00 KES per transfer
  agent:
    max-depth: 2                      # agent -> sub-agent
  lending:
    commission-rate-bps: 2000         # 20% of collected interest + fees goes to agents
    commission-split: [60, 40]        # originating agent, then its parent
    default-after-days: 90
    approve-score: 50
    review-score: 35
  risk:
    approve-below: 30                 # 0-29 approve, 30-79 human review, 80+ reject
    reject-at-or-above: 80
    velocity-window: 10m
    velocity-max-transfers: 5
    large-amount-minor: 2000000       # 20,000.00 KES
  anomaly:
    z-score-threshold: 3.0
    min-history-days: 7
  insights:
    enabled: true
  assistant:
    top-k: 4
    similarity-threshold: 0.55
    ingest-on-startup: true
  search:
    enabled: false                    # opt-in read model; dev profile turns it on (needs an OpenSearch cluster)
    url: ${OPENSEARCH_URL:http://localhost:9200}
    username: ${OPENSEARCH_USERNAME:}
    password: ${OPENSEARCH_PASSWORD:}
    index-prefix: kibetipay
  security:
    users: []                         # dev profile seeds demo users

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
